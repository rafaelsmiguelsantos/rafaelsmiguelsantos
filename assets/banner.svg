    <text x="300" y="295">Kafka</text>
    <rect x="386" y="278" width="134" height="26" rx="13" fill="none" stroke="#2B7A6F" stroke-opacity="0.35"/>
    <text x="402" y="295">Kubernetes</text>
    <rect x="530" y="278" width="78" height="26" rx="13" fill="none" stroke="#2B7A6F" stroke-opacity="0.35"/>
